name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest -q -n 2 --dist loadgroup

  smoke-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [core, db, redis, di, tgbot, max, payments, testing]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel
      - name: Install wheel into a clean env and import public modules
        run: |
          uv venv /tmp/smoke
          WHEEL=$(ls dist/*.whl)
          case "${{ matrix.profile }}" in
            core)    uv pip install --python /tmp/smoke/bin/python "$WHEEL" ;;
            # testing композитный: сам по себе не даёт ни одного импортируемого модуля -
            # db/providers_tg/providers_max требуют db или платформу (README, таблица extras)
            testing) uv pip install --python /tmp/smoke/bin/python "${WHEEL}[testing,db]" ;;
            *)       uv pip install --python /tmp/smoke/bin/python "${WHEEL}[${{ matrix.profile }}]" ;;
          esac
          case "${{ matrix.profile }}" in
            core)     M="bira_core.log.setup bira_core.log.redaction bira_core.dt.timezone bira_core.kbd.wrap bira_core.tls.russian_trusted bira_core.auth bira_core.web.cron bira_core.web.bootstrap bira_core.notify.delivery bira_core.notify.bulk bira_core.notify.split bira_core.notify.sender bira_core.notify.alerts bira_core.protect.flood_guard bira_core.protect.heuristics bira_core.protect.middleware" ;;
            db)       M="bira_core.db.base bira_core.db.dao bira_core.db.url bira_core.db.settings bira_core.db.mixins bira_core.db.queries bira_core.db.alembic" ;;
            redis)    M="bira_core.redis.client bira_core.protect.rate_limit" ;;
            di)       M="bira_core.di.warmup bira_core.di.notify" ;;
            tgbot)    M="bira_core.tgbot.filters bira_core.tgbot.commands bira_core.tgbot.errors bira_core.tgbot.keyboards bira_core.tgbot.last bira_core.tgbot.media_transfer bira_core.tgbot.forum bira_core.tgbot.dialogs" ;;
            max)      M="bira_core.maxbot.filters bira_core.maxbot.web bira_core.maxbot.dialogs" ;;
            payments) M="bira_core.payments.tbank" ;;
            testing)  M="bira_core.testing.db" ;;
          esac
          for m in $M; do /tmp/smoke/bin/python -c "import $m" || exit 1; done
          echo "smoke ok: ${{ matrix.profile }}"
