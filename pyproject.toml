[project]
name = "bira-core"
version = "0.3.0"
description = "Fleet plumbing for aiogram bots: logging redaction, webhook bootstrap, cron gates, DAO base, notifier."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.4",
]

[project.optional-dependencies]
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "pydantic>=2"]
redis = ["redis>=5"]
di = ["dishka>=1.3"]
tgbot = ["aiogram>=3.20"]
dialogs = ["aiogram>=3.20", "aiogram-dialog>=2.5,<3"]
max = ["maxo>=0.8,<1.0"]
payments = ["tenacity>=8"]
protect = ["redis>=5"]
alembic = ["alembic>=1.13", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
# Провайдеры/фикстуры для тестов потребителя; платформа добирается своим extra:
# [testing,tgbot], [testing,dialogs], [testing,max], [testing,db].
testing = ["dishka>=1.3", "pytest>=8"]

[project.scripts]
bira-rules-check = "bira_core.rules_check:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.16.0",
    "mypy>=1.11",
    "aiogram>=3.20",
    "dishka>=1.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2",
    "redis>=5",
    "alembic>=1.13",
    "aiogram-dialog>=2.5,<3",
    "pytest-xdist>=3.5",
    "maxo>=0.8,<1.0",
    "tenacity>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bira_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["xdist_group(name): xdist loadgroup для shared Postgres"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bira_core"]
mypy_path = "src"

[tool.ruff.lint]
extend-select = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
