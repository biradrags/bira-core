[project]
name = "bira-core"
version = "0.1.0"
description = "Fleet plumbing for aiogram bots: logging redaction, webhook bootstrap, cron gates, DAO base, notifier."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "pydantic>=2"]
redis = ["redis>=5"]
di = ["dishka>=1.3"]
dialogs = ["aiogram-dialog>=2.5,<3"]
alembic = ["alembic>=1.13", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]

[project.scripts]
bira-rules-check = "bira_core.rules_check:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.16.0",
    "mypy>=1.11",
    "dishka>=1.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2",
    "redis>=5",
    "alembic>=1.13",
    "aiogram-dialog>=2.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bira_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bira_core"]
mypy_path = "src"
